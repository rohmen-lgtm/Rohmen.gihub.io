<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Link Promo</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    text-align: center;
    color: #222;
}

.container {
    max-width: 450px;
    margin: 60px auto;
    padding: 25px;
}

.box {
    background: white;
    padding: 30px 20px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

h1 {
    margin-top: 0;
    font-size: 28px;
}

#status {
    font-size: 18px;
    margin: 20px 0;
}

#timer {
    font-size: 45px;
    font-weight: bold;
    margin: 15px 0;
}

#openButton {
    display: none;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: #1683ff;
    color: white;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
}

#openButton:active {
    transform: scale(0.97);
}

#counter {
    margin-top: 20px;
    font-size: 14px;
    color: #777;
}
</style>
</head>

<body>

<div class="container">

    <div class="box">

        <h1>LINK PROMO</h1>

        <div id="status">
            Menyiapkan link...
        </div>

        <div id="timer">
            3
        </div>

        <button id="openButton">
            BUKA LINK
        </button>

        <div id="counter"></div>

    </div>

</div>


<script>

// ==============================
// 10 LINK TINYURL KAMU
// ==============================

const links = [

    "https://tinyurl.com/5n85v7fx",

    "https://tinyurl.com/zstdkee3",

    "https://tinyurl.com/3h86z6mv",

    "https://tinyurl.com/3kfvpdpc",

    "https://tinyurl.com/94kfr2fk",

    "https://tinyurl.com/99w5ba4s",

    "https://tinyurl.com/3ej2um9v",

    "https://tinyurl.com/4yjjnwrx",

    "https://tinyurl.com/3r227zen",

    "https://tinyurl.com/yktcp87f"

];


// ==============================
// MENENTUKAN LINK BERIKUTNYA
// ==============================

let index = parseInt(
    localStorage.getItem("promoIndex") || "0",
    10
);

if (index < 0 || index >= links.length) {
    index = 0;
}


// ==============================
// TAMPILAN
// ==============================

const timer = document.getElementById("timer");
const status = document.getElementById("status");
const button = document.getElementById("openButton");
const counter = document.getElementById("counter");

status.textContent = "Link siap dibuka";

counter.textContent =
    "Link " + (index + 1) + " dari " + links.length;


// ==============================
// HITUNG MUNDUR 3 DETIK
// ==============================

let seconds = 3;

const countdown = setInterval(function() {

    seconds--;

    timer.textContent = seconds;

    if (seconds <= 0) {

        clearInterval(countdown);

        timer.textContent = "✓";

        status.textContent =
            "Silakan klik tombol di bawah";

        button.style.display = "block";

    }

}, 1000);


// ==============================
// SAAT PENGUNJUNG KLIK
// ==============================

button.addEventListener("click", function() {

    // Simpan link berikutnya
    let nextIndex = (index + 1) % links.length;

    localStorage.setItem(
        "promoIndex",
        nextIndex
    );

    // Buka link yang dipilih pengunjung
    window.location.href = links[index];

});

</script>

</body>
</html>
